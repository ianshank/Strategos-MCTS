name: E2E Tests with LangSmith Tracing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: e2e-langsmith-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every traced job below needs LANGSMITH_API_KEY. The `secrets` context is NOT
  # available in a job-level `if:`, so presence is probed once here and published
  # as an output the dependent jobs can gate on. Forks and secret-less clones then
  # skip cleanly instead of running tests that cannot possibly work — which is what
  # the blanket `|| true` used to paper over.
  check-secrets:
    name: Check LangSmith Credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_langsmith: ${{ steps.probe.outputs.has_langsmith }}
    steps:
      - name: Probe for LangSmith credentials
        id: probe
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          if [ -n "${LANGSMITH_API_KEY}" ]; then
            echo "has_langsmith=true" >> "$GITHUB_OUTPUT"
            echo "LangSmith credentials present; traced jobs will run."
          else
            echo "has_langsmith=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=LangSmith not configured::LANGSMITH_API_KEY is unset, so the traced E2E jobs are skipped rather than run without tracing."
          fi

  e2e-tests-traced:
    name: E2E Tests with LangSmith Tracing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check-secrets
    if: needs.check-secrets.outputs.has_langsmith == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # models/*.pt are Git-LFS pointers. Without this the e2e suite loads a
          # 130-byte text file as a checkpoint and dies with
          # "UnpicklingError: Unsupported operand 118" (118 == 'v', the first byte of
          # "version https://git-lfs.github.com/spec/v1"). Harmless while the job ran
          # behind `|| true`; deterministically red now that it does not.
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-mock pytest-timeout
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .[dev]; fi

      - name: Run E2E tests with LangSmith tracing
        run: |
          pytest tests/e2e/ \
            -m e2e \
            -v \
            --tb=short \
            --junitxml=e2e-results.xml
        env:
          # LangSmith Configuration
          LANGSMITH_TRACING: true
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: https://api.smith.langchain.com
          LANGSMITH_PROJECT: langgraph-multi-agent-mcts
          # CI metadata for traces
          CI: true
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          # Mock LLM keys (for tests)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: e2e-results.xml

      - name: Report E2E test summary
        if: always()
        run: |
          if [ -f e2e-results.xml ]; then
            echo "E2E tests completed. Check LangSmith for detailed traces:"
            echo "https://smith.langchain.com/o/${{ secrets.LANGSMITH_ORG_ID }}/projects/p/langgraph-multi-agent-mcts"
          fi

  api-smoke-tests-traced:
    name: API Smoke Tests with Tracing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-secrets, e2e-tests-traced]
    if: >-
      needs.check-secrets.outputs.has_langsmith == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Start API server in background
        run: |
          # Start the API server (adjust command based on your setup)
          # python -m uvicorn src.api.main:app --port 8000 &
          # sleep 5
          echo "API server would be started here in real deployment"

      - name: Run traced smoke tests
        run: |
          python scripts/smoke_test_traced.py --port 8000
        env:
          LANGSMITH_TRACING: true
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: https://api.smith.langchain.com
          LANGSMITH_PROJECT: langgraph-multi-agent-mcts
          CI: true
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}

  mcts-performance-tests:
    name: MCTS Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-secrets, e2e-tests-traced]
    if: >-
      needs.check-secrets.outputs.has_langsmith == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run MCTS performance tests with tracing
        run: |
          pytest tests/e2e/test_mcts_simulation_flow.py \
            -m performance \
            -v \
            --tb=short
        env:
          LANGSMITH_TRACING: true
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: https://api.smith.langchain.com
          LANGSMITH_PROJECT: langgraph-multi-agent-mcts
          CI: true
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}

  summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-secrets, e2e-tests-traced, api-smoke-tests-traced, mcts-performance-tests]
    # `!cancelled()` rather than `always()`: cancel-in-progress supersedes runs by
    # design, and a superseded run must not report as a failure.
    if: ${{ !cancelled() }}
    steps:
      - name: Check all E2E test results
        env:
          E2E: ${{ needs.e2e-tests-traced.result }}
          SMOKE: ${{ needs.api-smoke-tests-traced.result }}
          PERF: ${{ needs.mcts-performance-tests.result }}
          HAS_LANGSMITH: ${{ needs.check-secrets.outputs.has_langsmith }}
          CHECK_SECRETS: ${{ needs.check-secrets.result }}
        run: |
          echo "=== E2E Test Pipeline Summary ==="
          echo "LangSmith configured: ${HAS_LANGSMITH}"
          echo "E2E Tests:         ${E2E}"
          echo "API Smoke Tests:   ${SMOKE}"
          echo "MCTS Performance:  ${PERF}"
          echo ""
          echo "View detailed traces in LangSmith:"
          echo "https://smith.langchain.com/projects/langgraph-multi-agent-mcts"

          # 'skipped' is a legitimate outcome (no credentials, or not a main-branch
          # push). 'failure' and 'cancelled' are not, and previously went unreported
          # because this job only echoed. Treat any non-success, non-skipped result
          # as a pipeline failure.
          # If the credential probe itself did not succeed, everything downstream
          # skipped for the WRONG reason and the pipeline silently did not run.
          # "skipped, no credentials" is fine; "skipped, upstream broke" is not.
          status=0
          if [ "${CHECK_SECRETS}" != "success" ]; then
            echo "::error::check-secrets finished with result '${CHECK_SECRETS}'; the traced jobs skipped without being evaluated."
            status=1
          fi
          case "${HAS_LANGSMITH}" in
            true|false) ;;
            *) echo "::error::check-secrets published has_langsmith='${HAS_LANGSMITH}' (expected true/false)"; status=1 ;;
          esac
          # Same shape as ci.yml's summary: the reported set and the gated set are
          # one list, so they cannot drift apart. tests/unit/test_ci_workflow_invariants.py
          # parses this assignment and asserts every needs-derived env var appears in it.
          JOBS="E2E SMOKE PERF"
          for job in ${JOBS}; do
            result="${!job}"
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::${job} finished with result '${result}'"; status=1 ;;
            esac
          done
          exit "${status}"
