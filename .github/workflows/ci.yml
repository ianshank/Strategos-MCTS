name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        # Install the pinned ruff/black from the package's [dev] extra so the lint job
        # uses the same versions validated locally (prevents tool-version drift).
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black src/ tests/ --check --line-length 120

      - name: Check linting with ruff
        run: ruff check src/ tests/ --output-format=github

  spec-validate:
    name: Spec Validation & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install package (for the harness CLI)
        run: pip install -e ".[dev]"

      - name: Validate spec-driven specs
        # Each specs/*.SPEC.md must satisfy spec schema v2 (id/status lifecycle,
        # AC-n criterion IDs, no inline done-markers); one multi-path invocation
        # so cross-file rules (duplicate spec ids) can fire.
        run: |
          shopt -s nullglob
          specs=(specs/*.SPEC.md)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs found under specs/ — skipping."
            exit 0
          fi
          harness validate-spec "${specs[@]}"

      - name: Scan for hardcoded secrets
        # No plaintext API-key material may be committed to source or manifests.
        run: |
          # Match real key shapes (>=20 chars) to avoid prose false-positives like "task-specific".
          if git grep -nE "sk-[A-Za-z0-9]{20,}" -- src/ kubernetes/; then
            echo "::error::Hardcoded API key material detected in src/ or kubernetes/"
            exit 1
          fi
          echo "OK: no hardcoded key material found"

  type-check:
    name: Type Check with MyPy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev,neural]"

      - name: Show installed package versions
        run: |
          python --version
          mypy --version
          pip list 2>&1 | head -100

      - name: Run mypy
        run: mypy src/ --no-error-summary

  security-scan:
    name: Security Scan with Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Fail on high severity issues
        run: |
          if [ -f bandit-report.json ]; then
            python -c "
          import json, sys
          d = json.load(open('bandit-report.json'))
          high = [r for r in d.get('results', []) if r.get('issue_severity') == 'HIGH']
          if high:
              print('HIGH SEVERITY ISSUES FOUND:')
              for r in high:
                  print(f\"  - {r.get('filename')}:{r.get('line_number')}: {r.get('issue_text')}\")
              sys.exit(1)
          print('No high severity issues found')
          "
          fi

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install -e .

      - name: Run pip-audit
        run: pip-audit --format=json --output=pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Fail on critical vulnerabilities
        run: |
          if [ -f pip-audit-report.json ]; then
            python -c "
          import json, sys
          d = json.load(open('pip-audit-report.json'))
          crit = [dep for dep in d.get('dependencies', [])
                  if any(v.get('severity', '') == 'CRITICAL' for v in dep.get('vulns', []))]
          if crit:
              print('CRITICAL VULNERABILITIES FOUND:')
              for dep in crit:
                  print(f\"  - {dep.get('name')}=={dep.get('version')}\")
              sys.exit(1)
          print('No critical vulnerabilities found')
          "
          fi

  test:
    name: Tests with Pytest
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev,neural]"

      - name: Show installed package versions
        run: pip list 2>&1 | head -100

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --junitxml=junit.xml \
            -v \
            --ignore=tests/unit/test_inference_server.py \
            --ignore=tests/unit/test_rest_server.py \
            --ignore=tests/unit/test_rest_server_ext.py
        env:
          WANDB_MODE: disabled
          LANGCHAIN_TRACING_V2: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OPENAI_API_KEY: "sk-test-key-not-real"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit.xml

  chess-tests:
    name: Chess Domain Tests (optional extra)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies (with chess extra)
        run: pip install -e ".[dev,neural,chess]"

      # No coverage flags: the 85% gate is owned by the main test job (which runs
      # without python-chess); this job proves the chess domain registers and works.
      # tests/games/chess/unit/ is excluded: it targets a pre-refactor API
      # (encoder.encode/decode, state.legal_moves) and needs a repair pass before it
      # can gate anything — see docs/STATUS.md "Chess domain" notes.
      - name: Run chess domain + policy-lift tests
        run: |
          pytest tests/games/chess/test_state.py \
            tests/games/chess/test_action_space.py \
            tests/games/chess/test_config.py \
            tests/unit/framework/test_domain_registry.py \
            tests/unit/framework/test_domain_registry_chess.py \
            tests/unit/benchmark/test_policy_comparison.py \
            tests/unit/benchmark/test_policy_lift_cli.py \
            -m "not slow" -q
        env:
          WANDB_MODE: disabled
          LANGCHAIN_TRACING_V2: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OPENAI_API_KEY: "sk-test-key-not-real"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration/ -v --tb=short
          else
            echo "No integration tests found"
          fi
        env:
          CI: "true"
          LOG_LEVEL: INFO

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build tools
        run: pip install build wheel

      - name: Verify package structure
        run: |
          # Check that all __init__.py files exist
          find src -type d -exec test -f {}/__init__.py \; -print | head -20

      - name: Build package
        run: python -m build --no-isolation --wheel

  docker-build:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    permissions:
      contents: read
      packages: write
      security-events: write  # required for github/codeql-action/upload-sarif (Trivy results)
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          load: true
          tags: langgraph-mcts:test
          # Isolated cache scope + ignore-error to avoid cross-workflow manifest
          # collisions that surface as transient "BlobNotFound" 404s.
          cache-from: type=gha,scope=ci-production
          cache-to: type=gha,mode=max,scope=ci-production,ignore-error=true
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Test Docker image - Structure
        run: |
          echo "Testing Docker image structure..."
          docker run --rm langgraph-mcts:test ls -la /app/src
          docker run --rm langgraph-mcts:test python -c "import sys; print(f'Python version: {sys.version}')"

      - name: Test Docker image - Dependencies
        run: |
          echo "Testing installed dependencies..."
          docker run --rm langgraph-mcts:test pip list | grep -E "(langgraph|langchain|pydantic|httpx)"

      - name: Test Docker image - Health Check
        run: |
          echo "Starting container for health check..."
          docker run -d --name mcts-test \
            -p 8000:8000 \
            -e LLM_PROVIDER=lmstudio \
            -e LOG_LEVEL=INFO \
            langgraph-mcts:test

          # Wait for container to be healthy
          timeout 60s bash -c 'until docker inspect --format="{{.State.Health.Status}}" mcts-test | grep -q "healthy"; do sleep 2; done' || \
          (echo "Container failed to become healthy" && docker logs mcts-test && exit 1)

          echo "Container is healthy!"
          docker logs mcts-test
          docker stop mcts-test
          docker rm mcts-test

      - name: Run basic API tests
        run: |
          echo "Starting container for API testing..."
          docker run -d --name mcts-api-test \
            -p 8000:8000 \
            -e LLM_PROVIDER=lmstudio \
            -e LOG_LEVEL=INFO \
            langgraph-mcts:test

          # Wait for service to be ready
          sleep 10

          # Test health endpoint
          curl -f http://localhost:8000/health || (echo "Health check failed" && docker logs mcts-api-test && exit 1)

          # Test metrics endpoint (if available)
          curl -f http://localhost:8000/metrics || echo "Metrics endpoint not available"

          # Cleanup
          docker stop mcts-api-test
          docker rm mcts-api-test

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        # Advisory only (exit-code 0). Don't fail the job if Trivy's DB download flakes
        # (a recurring infra issue) — the SARIF upload below is guarded on file existence.
        continue-on-error: true
        with:
          image-ref: langgraph-mcts:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        # Only upload when Trivy actually produced the SARIF (avoids
        # "Path does not exist: trivy-results.sarif" failing the job on a Trivy flake).
        # Advisory: don't fail the build if code scanning is unavailable on the repo
        # (e.g. GHAS disabled) — the job-level security-events: write permission is the
        # primary fix; continue-on-error is the fallback.
        continue-on-error: true
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Build and push Docker image (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ci-production
          cache-to: type=gha,mode=max,scope=ci-production,ignore-error=true
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Generate image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Docker image pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Image can be pulled with:"
          echo "docker pull ghcr.io/${{ github.repository }}:latest"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, security-scan, dependency-audit, test, build-check, docker-build]
    if: always()
    steps:
      - name: Check all job results
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Lint & Format:     ${{ needs.lint.result }}"
          echo "Type Check:        ${{ needs.type-check.result }}"
          echo "Security Scan:     ${{ needs.security-scan.result }}"
          echo "Dependency Audit:  ${{ needs.dependency-audit.result }}"
          echo "Tests:             ${{ needs.test.result }}"
          echo "Build Check:       ${{ needs.build-check.result }}"
          echo "Docker Build:      ${{ needs.docker-build.result }}"

          # Fail if any critical job failed
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.type-check.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build-check.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "::error::Critical job failed!"
            exit 1
          fi

          echo "All critical checks passed!"

# ============================================================================
# RAG Evaluation Workflow (On-Demand)
# ============================================================================
# This workflow runs comprehensive RAG evaluations with ragas metrics.
# Triggered manually or on schedule for cost control.

  rag-eval:
    name: RAG Evaluation with Ragas
    runs-on: ubuntu-latest
    # Run on workflow_dispatch, scheduled runs, or PRs to main/develop
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(fromJson('["main", "develop"]'), github.base_ref))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Create results directory
        run: mkdir -p results

      - name: Setup RAG evaluation dataset
        run: |
          python scripts/create_rag_eval_datasets.py
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        continue-on-error: true

      - name: Run RAG evaluation (baseline)
        id: baseline_eval
        run: |
          python scripts/evaluate_rag.py \
            --dataset rag-eval-dataset \
            --limit 50 \
            --mcts-enabled false \
            --output results/baseline_eval.csv
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          WANDB_MODE: online
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'lmstudio' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_LEVEL: INFO
        continue-on-error: true

      - name: Run RAG evaluation (MCTS enabled)
        id: mcts_eval
        run: |
          python scripts/evaluate_rag.py \
            --dataset rag-eval-dataset \
            --limit 50 \
            --mcts-enabled true \
            --output results/mcts_eval.csv
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          WANDB_MODE: online
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'lmstudio' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_LEVEL: INFO
        continue-on-error: true

      - name: Compare results
        run: |
          if [ -f results/baseline_eval.csv ] && [ -f results/mcts_eval.csv ]; then
            echo "=== RAG Evaluation Comparison ==="
            echo "Baseline results:"
            python -c "import pandas as pd; df=pd.read_csv('results/baseline_eval.csv'); print(df.describe())"
            echo ""
            echo "MCTS results:"
            python -c "import pandas as pd; df=pd.read_csv('results/mcts_eval.csv'); print(df.describe())"
          else
            echo "One or both evaluation files not found"
          fi
        continue-on-error: true

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: results/*.csv
        if: always()

      - name: Upload to LangSmith
        run: |
          echo "RAG evaluation results uploaded to LangSmith and W&B"
          echo "Check W&B dashboard: https://wandb.ai"
          echo "Check LangSmith dashboard: https://smith.langchain.com"
        if: always()
