name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        # Install the pinned ruff/black from the package's [dev] extra so the lint job
        # uses the same versions validated locally (prevents tool-version drift).
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black . --check --line-length 120

      - name: Check linting with ruff
        run: ruff check . --output-format=github

  spec-validate:
    name: Spec Validation & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # spec-trace diffs against the PR base branch
          persist-credentials: false  # job only needs local git after this fetch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install package (for the harness CLI)
        run: pip install -e ".[dev]"

      - name: Validate spec-driven specs
        # Each specs/*.SPEC.md must satisfy spec schema v2 (id/status lifecycle,
        # AC-n criterion IDs, no inline done-markers); one multi-path invocation
        # so cross-file rules (duplicate spec ids) can fire.
        run: |
          shopt -s nullglob
          specs=(specs/*.SPEC.md)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs found under specs/ — skipping."
            exit 0
          fi
          harness validate-spec "${specs[@]}"

      - name: Spec traceability (PRs only)
        # A PR touching src/** must run on a spec/<id> branch whose spec is
        # 'approved' on the base branch (the completing PR may flip it to
        # 'implemented' in its own diff), OR carry a 'No-Spec: <reason>'
        # commit trailer. Any flip to 'verified' requires same-line
        # spec-id + AC-n mappings under tests/. Push events have no base
        # ref, hence the guard. See docs/plans/SDD_PLUGIN_EXTRACTION_PLAN.md §3.
        if: github.event_name == 'pull_request'
        env:
          # Branch names are attacker-controlled on fork PRs; env-var
          # indirection keeps them out of the shell-parsed script text.
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          harness spec-trace \
            --base-ref "origin/$BASE_REF" \
            --head-ref HEAD \
            --branch "$HEAD_BRANCH"

      - name: Scan for hardcoded secrets
        # No plaintext API-key material may be committed to source or manifests.
        run: |
          # Match real key shapes (>=20 chars) to avoid prose false-positives like "task-specific".
          if git grep -nE "sk-[A-Za-z0-9]{20,}" -- src/ kubernetes/; then
            echo "::error::Hardcoded API key material detected in src/ or kubernetes/"
            exit 1
          fi
          echo "OK: no hardcoded key material found"

  type-check:
    name: Type Check with MyPy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev,neural]"

      - name: Show installed package versions
        run: |
          python --version
          mypy --version
          pip list 2>&1 | head -100

      - name: Run mypy
        run: mypy src/ --no-error-summary

  security-scan:
    name: Security Scan with Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Fail on high severity issues
        run: |
          # No `else` here previously: if bandit crashed before writing the report,
          # this step passed silently and the scan gated nothing. A missing report is
          # now itself a failure.
          if [ ! -f bandit-report.json ]; then
            echo "::error::bandit produced no report — the scan did not run to completion."
            exit 1
          fi
          python -c "
          import json, sys
          d = json.load(open('bandit-report.json'))
          high = [r for r in d.get('results', []) if r.get('issue_severity') == 'HIGH']
          if high:
              print('HIGH SEVERITY ISSUES FOUND:')
              for r in high:
                  print(f\"  - {r.get('filename')}:{r.get('line_number')}: {r.get('issue_text')}\")
              sys.exit(1)
          print('No high severity issues found')
          "

  secret-scan-gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — gitleaks-action scans the commit range introduced by this push/PR, which
      # needs full history to resolve; it does not rescan the repository's entire prior history.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install -e .

      - name: Run pip-audit
        run: pip-audit --format=json --output=pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Fail on critical vulnerabilities
        run: |
          # Same fail-open closure as the bandit gate above: a missing report means
          # pip-audit did not complete, which is a failure rather than a pass.
          if [ ! -f pip-audit-report.json ]; then
            echo "::error::pip-audit produced no report — the audit did not run to completion."
            exit 1
          fi
          python - <<'PYEOF'
          import json
          d = json.load(open('pip-audit-report.json'))
          deps = d.get('dependencies', [])
          vulnerable = [dep for dep in deps if dep.get('vulns')]
          # pip-audit's JSON formatter emits no severity field — each advisory carries
          # only id / fix_versions / aliases / description. A previous version of this
          # step filtered on v['severity'] == 'CRITICAL', which is never true, so the
          # gate was decorative. Report honestly rather than pretend to rank.
          keys = {k for dep in vulnerable for v in dep['vulns'] for k in v}
          if 'severity' in keys:
              print('NOTE: pip-audit now emits severity; this step can be tightened.')
          print('pip-audit: %d dependencies scanned, %d with known advisories'
                % (len(deps), len(vulnerable)))
          for dep in vulnerable:
              ids = ','.join(sorted({v['id'] for v in dep['vulns']}))
              fixes = sorted({f for v in dep['vulns'] for f in v.get('fix_versions', [])})
              suffix = ' (fixed in %s)' % ','.join(fixes) if fixes else ' (no fix available)'
              print('  - %s==%s: %s%s' % (dep.get('name'), dep.get('version'), ids, suffix))
          # Advisory on findings by design: without severity, failing on any advisory
          # would block on unfixable transitive noise. The job still fails if pip-audit
          # itself crashes or writes no report (guarded above).
          PYEOF

  test:
    name: Tests with Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        # `api` is required, not optional: without FastAPI the three API-server test
        # suites cannot even be collected, which is what let them go ungated.
        run: pip install -e ".[dev,neural,api]"

      - name: Show installed package versions
        run: pip list 2>&1 | head -100

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --junitxml=junit.xml \
            -v
        env:
          WANDB_MODE: disabled
          LANGCHAIN_TRACING_V2: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OPENAI_API_KEY: "sk-test-key-not-real"
          # This job installs .[dev,neural,api] on purpose, so a missing optional
          # dependency is a misconfigured runner, not a reason to collect fewer tests.
          # Scoped to this job only: chess-tests and integration-test install narrower
          # sets and must keep degrading to skips.
          STRICT_OPTIONAL_DEPS: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit.xml

  ui-tests:
    name: UI Tests (gradio extra)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # No other job installs [ui] or builds a Gradio Blocks graph, which is how a
      # launch-blocking TypeError in src/games/chess/ui.py reached main behind 66
      # passing tests: every existing chess-UI test exercised pure helpers only.
      # [chess] is required too — the chess UI imports python-chess, and without it
      # importorskip collapses the whole module to a single skip.
      - name: Install dependencies (with ui + chess extras)
        run: pip install -e ".[dev,neural,api,ui,chess]"

      - name: Report resolved gradio version
        run: python -c "import gradio; print('gradio', gradio.__version__)"

      # No coverage flags: the 85% gate is owned by the main test job. This job
      # proves the UI actually constructs against the installed gradio major.
      - name: Run UI construction and compatibility tests
        run: |
          pytest tests/unit/test_gradio_compat.py \
            tests/unit/test_chess_ui_construction.py \
            tests/unit/test_chess_ui.py \
            tests/unit/test_structured_logger_contract.py \
            tests/unit/test_checkpoints.py \
            tests/unit/test_agent_routes.py \
            tests/unit/test_ui_status.py \
            tests/unit/test_framework_service_fallback.py \
            tests/ui \
            -m "not slow" -q
        env:
          WANDB_MODE: disabled
          LANGCHAIN_TRACING_V2: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Settings requires a provider key of at least 40 characters.
          OPENAI_API_KEY: "sk-test-not-a-real-key-000000000000000000000000"

      # app.py must import without any provider key configured. Regression guard:
      # a module-scope get_settings() previously made `import app` raise
      # ValidationError, turning tests/ui into a collection error that aborted the
      # entire session and making all 27 tests in tests/e2e/test_ui_e2e.py ERROR.
      - name: Verify app.py imports without a provider key
        run: python -c "import app; print('app imports clean; APP_VERSION =', app.APP_VERSION)"
        env:
          WANDB_MODE: disabled
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  chess-tests:
    name: Chess Domain Tests (optional extra)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies (with chess extra)
        run: pip install -e ".[dev,neural,chess]"

      # No coverage flags: the 85% gate is owned by the main test job (which runs
      # without python-chess); this job proves the chess domain registers and works.
      # tests/games/chess/unit/ is excluded: it targets a pre-refactor API
      # (encoder.encode/decode, state.legal_moves) and needs a repair pass before it
      # can gate anything — see docs/STATUS.md "Chess domain" notes.
      - name: Run chess domain + policy-lift tests
        run: |
          pytest tests/games/chess/test_state.py \
            tests/games/chess/test_action_space.py \
            tests/games/chess/test_config.py \
            tests/unit/framework/test_domain_registry.py \
            tests/unit/framework/test_domain_registry_chess.py \
            tests/unit/benchmark/test_policy_comparison.py \
            tests/unit/benchmark/test_policy_lift_cli.py \
            -m "not slow" -q
        env:
          WANDB_MODE: disabled
          LANGCHAIN_TRACING_V2: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OPENAI_API_KEY: "sk-test-key-not-real"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        # neural extra included so the torch-gated integration files (agent
        # orchestration, demo pipeline) execute instead of importorskip-ing silently.
        run: pip install -e ".[dev,neural]"

      - name: Run integration tests
        # test_deployed_models.py is excluded: it rebuilds the checkpoint's
        # DeBERTa+LoRA architecture via AutoModel.from_pretrained, which needs a
        # warm HuggingFace cache (tests/conftest.py forces HF_HUB_OFFLINE=1), so
        # it can only run on machines that already hold the pretrained weights.
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration/ -v --tb=short \
              --ignore=tests/integration/test_deployed_models.py
          else
            echo "No integration tests found"
          fi
        env:
          CI: "true"
          LOG_LEVEL: INFO

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    # 25, not 15: the training-manifest resolve below backtracks and materializes
    # ~3 GB of wheels on a cold runner (measured 2m15s-3m35s cold, 70-90s warm).
    timeout-minutes: 25
    # Deliberately NOT gated behind lint/type-check. A broken dependency manifest
    # should report in its own right rather than queue behind mypy on 327 files —
    # the previous `needs: [lint, type-check]` delayed exactly the signal this job
    # now carries.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build tools
        run: pip install build wheel

      - name: Verify package structure
        run: |
          # Check that all __init__.py files exist
          find src -type d -exec test -f {}/__init__.py \; -print | head -20

      - name: Build package
        run: python -m build --no-isolation --wheel

      # training/requirements.txt is installed only by Dockerfile.train, so until now
      # nothing checked it could resolve except a multi-minute image build that was
      # itself already failing. Two Dependabot bumps (datasets 2.14->5.0.1,
      # tenacity 8.2->9.1.4) each made the file unresolvable and merged anyway,
      # leaving every training image build broken with ResolutionImpossible.
      #
      # --ignore-installed is load-bearing: without it pip resolves against this
      # runner's site-packages and can pass while the cold Docker build still fails,
      # which is precisely the blind spot this step exists to close.
      - name: Verify training manifest resolves
        run: pip install --dry-run --ignore-installed -r training/requirements.txt

  docker-build:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, type-check]
    permissions:
      contents: read
      packages: write
      security-events: write  # required for github/codeql-action/upload-sarif (Trivy results)
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          load: true
          tags: langgraph-mcts:test
          # Isolated cache scope + ignore-error to avoid cross-workflow manifest
          # collisions that surface as transient "BlobNotFound" 404s.
          cache-from: type=gha,scope=ci-production
          cache-to: type=gha,mode=max,scope=ci-production,ignore-error=true
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Test Docker image - Structure
        run: |
          echo "Testing Docker image structure..."
          docker run --rm langgraph-mcts:test ls -la /app/src
          docker run --rm langgraph-mcts:test python -c "import sys; print(f'Python version: {sys.version}')"

      - name: Test Docker image - Dependencies
        run: |
          echo "Testing installed dependencies..."
          docker run --rm langgraph-mcts:test pip list | grep -E "(langgraph|langchain|pydantic|httpx)"

      - name: Test Docker image - Health Check
        run: |
          echo "Starting container for health check..."
          docker run -d --name mcts-test \
            -p 8000:8000 \
            -e LLM_PROVIDER=lmstudio \
            -e LOG_LEVEL=INFO \
            langgraph-mcts:test

          # Wait for container to be healthy
          timeout 60s bash -c 'until docker inspect --format="{{.State.Health.Status}}" mcts-test | grep -q "healthy"; do sleep 2; done' || \
          (echo "Container failed to become healthy" && docker logs mcts-test && exit 1)

          echo "Container is healthy!"
          docker logs mcts-test
          docker stop mcts-test
          docker rm mcts-test

      - name: Run basic API tests
        run: |
          echo "Starting container for API testing..."
          docker run -d --name mcts-api-test \
            -p 8000:8000 \
            -e LLM_PROVIDER=lmstudio \
            -e LOG_LEVEL=INFO \
            langgraph-mcts:test

          # Wait for service to be ready
          sleep 10

          # Test health endpoint
          curl -f http://localhost:8000/health || (echo "Health check failed" && docker logs mcts-api-test && exit 1)

          # Test metrics endpoint (if available)
          curl -f http://localhost:8000/metrics || echo "Metrics endpoint not available"

          # Cleanup
          docker stop mcts-api-test
          docker rm mcts-api-test

      # Two scans with deliberately different postures, because they answer different
      # questions and have different failure modes.
      #
      # 1. Reporting scan (advisory): CRITICAL+HIGH -> SARIF -> the Security tab. A
      #    Trivy DB-download flake here is infrastructure noise, so it stays
      #    non-blocking and the upload below is guarded on the file existing.
      - name: Scan Docker image for vulnerabilities (report)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: langgraph-mcts:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4.37.3
        # Only upload when Trivy actually produced the SARIF (avoids
        # "Path does not exist: trivy-results.sarif" failing the job on a Trivy flake).
        # Advisory: don't fail the build if code scanning is unavailable on the repo
        # (e.g. GHAS disabled) — the job-level security-events: write permission is the
        # primary fix; continue-on-error is the fallback.
        continue-on-error: true
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # 2. Gating scan (blocking): CRITICAL only, fixable only. Previously the single
      #    scan carried BOTH continue-on-error:true AND exit-code:'0', so it could not
      #    fail anything while still costing ~3 minutes per run — an advisory job
      #    nobody reads. Scoped tightly so it stays actionable:
      #      - severity CRITICAL only (HIGH remains reported, not enforced)
      #      - ignore-unfixed: an unfixable base-image CVE is not something this PR
      #        can act on, so blocking on it would only train people to bypass
      #      - accepted findings are recorded in .trivyignore with an expiry date
      - name: Fail on CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: langgraph-mcts:test
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

      - name: Build and push Docker image (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ci-production
          # cache-to deliberately omitted. Measured on run 30863130823: this step
          # completes in 28s with all fifteen layers CACHED from the build step's
          # builder instance, so it has nothing new to export — re-exporting only
          # overwrites the manifest scope=ci-production was just written with, which
          # is the same-scope clobber implicated in the BlobNotFound import failures
          # at the top of the following run. cache-from is retained.
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Generate image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Docker image pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Image can be pulled with:"
          # github.repository is mixed-case (ianshank/Strategos-MCTS) but the pushed
          # image ref is lowercase, so the previous form printed a command that fails
          # with "repository name must be lowercase". Lowercase it before printing.
          echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, spec-validate, type-check, security-scan, secret-scan-gitleaks, dependency-audit, test, ui-tests, chess-tests, integration-test, build-check, docker-build]
    # `!cancelled()` rather than `always()`: cancel-in-progress supersedes runs by
    # design, and a superseded run must not report as a failure.
    if: ${{ !cancelled() }}
    steps:
      - name: Check all job results
        # Every job in `needs` is both reported AND gated. Previously chess-tests and
        # integration-test were absent from `needs` entirely, and security-scan and
        # dependency-audit were reported but omitted from the failure condition — so a
        # bandit HIGH or a critical CVE printed a red line and still merged green.
        env:
          LINT: ${{ needs.lint.result }}
          SPEC_VALIDATE: ${{ needs.spec-validate.result }}
          TYPE_CHECK: ${{ needs.type-check.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          SECRET_SCAN: ${{ needs.secret-scan-gitleaks.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          TESTS: ${{ needs.test.result }}
          UI_TESTS: ${{ needs.ui-tests.result }}
          CHESS_TESTS: ${{ needs.chess-tests.result }}
          INTEGRATION_TEST: ${{ needs.integration-test.result }}
          BUILD_CHECK: ${{ needs.build-check.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
        run: |
          echo "=== CI Pipeline Summary ==="
          # Single source of truth: the gated set and the reported set are the same
          # list, so a job can never again be printed without also being enforced.
          JOBS="LINT SPEC_VALIDATE TYPE_CHECK SECURITY_SCAN SECRET_SCAN \
                DEPENDENCY_AUDIT TESTS UI_TESTS CHESS_TESTS INTEGRATION_TEST \
                BUILD_CHECK DOCKER_BUILD"

          status=0
          for job in ${JOBS}; do
            result="${!job}"
            printf '  %-20s %s\n' "${job}" "${result}"
            case "${result}" in
              # 'skipped' is legitimate: integration-test is main-push only, and a
              # job skipped by its own `if:` has not failed.
              success|skipped) ;;
              *) status=1 ;;
            esac
          done

          echo ""
          if [ "${status}" -ne 0 ]; then
            for job in ${JOBS}; do
              result="${!job}"
              case "${result}" in
                success|skipped) ;;
                *) echo "::error::Required job ${job} finished with result '${result}'" ;;
              esac
            done
            exit 1
          fi

          echo "All required checks passed."

# ============================================================================
# RAG Evaluation Workflow (On-Demand)
# ============================================================================
# This workflow runs comprehensive RAG evaluations with ragas metrics.
# Triggered manually or on schedule for cost control.

  rag-eval:
    name: RAG Evaluation with Ragas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory-only job (every substantive step is continue-on-error and it is
    # excluded from the summary gate): run on demand or on a schedule, not on
    # every PR — it burns a runner and secrets for a result nothing gates on.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Create results directory
        run: mkdir -p results

      - name: Setup RAG evaluation dataset
        run: |
          python scripts/create_rag_eval_datasets.py
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        continue-on-error: true

      - name: Run RAG evaluation (baseline)
        id: baseline_eval
        run: |
          python scripts/evaluate_rag.py \
            --dataset rag-eval-dataset \
            --limit 50 \
            --mcts-enabled false \
            --output results/baseline_eval.csv
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          WANDB_MODE: online
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'lmstudio' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_LEVEL: INFO
        continue-on-error: true

      - name: Run RAG evaluation (MCTS enabled)
        id: mcts_eval
        run: |
          python scripts/evaluate_rag.py \
            --dataset rag-eval-dataset \
            --limit 50 \
            --mcts-enabled true \
            --output results/mcts_eval.csv
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          WANDB_MODE: online
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'lmstudio' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_LEVEL: INFO
        continue-on-error: true

      - name: Compare results
        run: |
          if [ -f results/baseline_eval.csv ] && [ -f results/mcts_eval.csv ]; then
            echo "=== RAG Evaluation Comparison ==="
            echo "Baseline results:"
            python -c "import pandas as pd; df=pd.read_csv('results/baseline_eval.csv'); print(df.describe())"
            echo ""
            echo "MCTS results:"
            python -c "import pandas as pd; df=pd.read_csv('results/mcts_eval.csv'); print(df.describe())"
          else
            echo "One or both evaluation files not found"
          fi
        continue-on-error: true

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: results/*.csv
        if: always()

      - name: Upload to LangSmith
        run: |
          echo "RAG evaluation results uploaded to LangSmith and W&B"
          echo "Check W&B dashboard: https://wandb.ai"
          echo "Check LangSmith dashboard: https://smith.langchain.com"
        if: always()
