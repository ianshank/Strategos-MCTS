version: 2
updates:
  # Python dependencies — root package (pyproject.toml + requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Python dependencies — training pipeline
  - package-ecosystem: "pip"
    directory: "/training"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      training-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(training)"
    labels:
      - "dependencies"

  # Python dependencies — Hugging Face Space deployment
  - package-ecosystem: "pip"
    directory: "/huggingface_space"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      hf-space-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(hf-space)"
    labels:
      - "dependencies"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker base images (Dockerfile, Dockerfile.test, Dockerfile.train)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
