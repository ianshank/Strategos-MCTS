[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-multi-agent-mcts"
version = "0.1.0"
description = "Multi-Agent Framework with MCTS Integration and LangGraph"
readme = "docs/langgraph_mcts_architecture.md"
authors = [
    {name = "MCTS Framework Team", email = "team@example.com"}
]
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["langgraph", "mcts", "multi-agent", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Upper bounds cap at the next major to prevent breaking API drift (e.g. langgraph's
    # typed API). The code runs against the current 1.x line of langgraph/langchain.
    "langgraph>=0.0.1,<2.0.0",
    "langchain>=0.1.0,<2.0.0",
    "langchain-core>=0.1.0,<2.0.0",
    "openai>=1.0.0,<3.0.0",
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    # Core: src/config/settings.py imports pydantic_settings unconditionally, so it is a
    # runtime dependency (was previously only satisfied transitively / via the benchmark extra).
    "pydantic-settings>=2.0.0,<3.0.0",
    "psutil>=5.9.0,<8.0.0",
    "aioboto3>=12.0.0,<16.0.0",
    "tenacity>=8.2.0,<10.0.0",
    "networkx>=3.0,<4.0",
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0,<2.0.0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.88.0",
    # Pin mypy to the validated minor: the no-redef diagnosis for optional-import
    # fallbacks (e.g. chess/mcp_chess_tools.py) varies across mypy releases, so an
    # unbounded range makes CI disagree with local. Bump deliberately when revalidated.
    "mypy>=1.19.0,<1.20.0",
    "types-psutil>=5.9.0",
    "types-requests>=2.31.0",
    # Cap ruff to the validated minor: ruff introduces new lint rules in minor releases,
    # so an unbounded range causes CI to drift and fail on code that passed locally.
    "ruff>=0.15.0,<0.16.0",
    "black>=24.0,<27.0",
    "pre-commit>=3.6.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.6.0",
]
prometheus = [
    "prometheus-client>=0.18.0",
]
api = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "PyJWT>=2.8.0,<3.0.0",  # optional JWT auth path (AUTH_MODE=jwt)
]
neural = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.7.0",
    "datasets>=2.14.0",
    "PyYAML>=6.0.0",
    "sentence-transformers>=2.2.0",
]
experiment = [
    "braintrust>=0.0.100",
]
vectordb = [
    "pinecone>=7.0.0",
]
google-adk = [
    "google-adk>=1.14",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
    "python-dotenv>=1.0.1",
    "immutabledict>=4.2.1",
    "sqlglot>=26.10.1",
    "db-dtypes>=1.4.2",
    "regex>=2024.11.6",
    "tabulate>=0.9.0",
    "absl-py>=2.2.2",
    "pandas>=2.3.0",
    "numpy>=2.3.1",
    "toolbox-core>=0.3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "pg8000>=1.31.2",
]
benchmark = [
    # Benchmark CLI needs only core dependencies now (pydantic-settings was promoted to core).
]
ui = [
    # Gradio UI (root app.py). Capped to <6.0.0 so a major release can't silently
    # break the Blocks/launch API the app relies on; bump deliberately after revalidating.
    "gradio>=4.0.0,<6.0.0",
]
chess = [
    # Chess adversarial domain (src/games/chess). Registers lazily in DomainRegistry;
    # without this extra the chess domain and its tests are skipped.
    "python-chess>=1.10.0",
]
all = [
    "langgraph-multi-agent-mcts[dev,prometheus,api,neural,experiment,vectordb,google-adk,benchmark,ui,chess]",
]

[project.scripts]
benchmark = "src.benchmark.cli:main"
harness = "src.framework.harness.cli:main"
policy-lift = "src.benchmark.policy_lift:main"
validate-context-docs = "src.tools.context_docs:main"

[project.urls]
Homepage = "https://github.com/ianshank/langgraph_multi_agent_mcts"
Repository = "https://github.com/ianshank/langgraph_multi_agent_mcts"
Documentation = "https://github.com/ianshank/langgraph_multi_agent_mcts/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable names (allow single letter vars in math/loops)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "B905",   # zip without strict parameter (not always needed)
    "ARG001", # unused function argument
    "ARG002", # unused method argument (often required by interface/protocol)
    "ARG005", # unused lambda argument
    "C416",   # unnecessary dict/list comprehension (sometimes clearer)
    "SIM108", # use ternary operator (sometimes less readable)
    "SIM116", # use dict.get (sometimes less clear)
    "SIM117", # combine with statements (sometimes clearer separate)
    "F541",   # f-string without placeholders (used for future formatting)
    "UP042",  # str+Enum -> StrEnum; project supports Python 3.10 which lacks StrEnum
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]  # Imports follow logging.basicConfig setup and the guarded optional gradio import
"tests/*" = ["ARG002", "E402"]  # Unused method argument - pytest fixtures; E402 for importorskip guards
"training/tests/*" = ["ARG002", "E402"]  # Unused method argument - pytest fixtures; E402 for importorskip guards
"tools/*" = ["ARG002"]  # Unused method argument - API handlers with required signatures
"training/*" = ["ARG002", "SIM108"]  # Training modules have complex patterns
"src/**/__init__.py" = ["E402"]  # Module-level imports after conditional torch/dependency checks

[tool.black]
line-length = 120
target-version = ["py311"]
skip-string-normalization = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# Heavy ML/orchestration libraries ship inline types whose strictness and API shift across
# releases (langgraph's Pregel overloads, torch's LR-scheduler hierarchy and Module.__call__,
# transformers' lazy module, etc.). With unpinned versions this makes type-checking
# non-deterministic between local and CI. Treat them as untyped (Any) so static analysis is
# stable regardless of the resolved version; the runtime still uses the real libraries.
[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langgraph",
    "torch.*",
    "torch",
    "transformers.*",
    "transformers",
    "peft.*",
    "datasets.*",
    "sentence_transformers.*",
    "numpy.*",
    "numpy",
    "httpx.*",
    "httpx",
    "opentelemetry.*",
    "psutil",
    "psutil.*",
    "prometheus_client",
    "prometheus_client.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# PyYAML ships no type stubs. mypy reports `import-untyped` at each `import yaml`
# site, which `ignore_missing_imports` does not suppress (that only covers
# `import-not-found`). Disable the code for exactly the three modules that import
# yaml — environment-independent (works whether or not types-PyYAML resolves).
[[tool.mypy.overrides]]
module = [
    "src.framework.assembly.config",
    "src.agents.meta_controller.config_loader",
    "src.utils.planning_loader",
]
disable_error_code = ["import-untyped"]

# chess/mcp_chess_tools.py defines fallback stubs for pydantic in an
# `except ImportError` block. Whether mypy flags these as [no-redef] depends on
# whether it resolves the real pydantic import, which differs between local and
# CI environments. Disable the code for this one module so the optional-import
# fallback pattern type-checks identically everywhere.
[[tool.mypy.overrides]]
module = ["src.games.chess.mcp_chess_tools"]
disable_error_code = ["no-redef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
timeout = 300  # 5 minute timeout for long-running tests
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: End-to-end user journey tests",
    "api: API endpoint tests",
    "training: Training pipeline tests",
    "dataset: Dataset integration tests",
    "performance: Performance and load tests",
    "security: Security validation tests",
    "chaos: Chaos engineering tests for system resilience",
    "smoke: Smoke tests for basic functionality",
    "benchmark: Performance benchmark tests",
    "component: Component-level tests for specific modules",
    "contract: Contract tests for API and interface compliance",
    "property: Property-based tests using hypothesis",
    "ui: UI/browser-based tests",
    "journey: User journey tests across features",
    "enterprise: Enterprise feature tests",
    "ma_due_diligence: M&A due diligence workflow tests",
    "selenium: Selenium browser automation tests",
    "harness: Agent harness framework tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "src/api/inference_server.py",
    "src/api/rest_server.py",
    # Modules that require optional `python-chess` dep; tests skip when absent
    "src/games/chess/ui.py",
    "src/games/chess/verification/game_verifier.py",
    "src/games/chess/verification/move_validator.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 85.0  # Enforced minimum coverage threshold
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
    "@abstractmethod",
]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B311"]  # Skip assert and random warnings
targets = ["src"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
