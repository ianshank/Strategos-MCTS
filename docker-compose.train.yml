# =============================================================================
# Training-Specific Docker Compose Configuration
# =============================================================================
#
# GPU-enabled training services with comprehensive monitoring
#
# Usage:
#   # Demo training
#   docker-compose -f docker-compose.train.yml up training-demo
#
#   # Production training with monitoring
#   docker-compose -f docker-compose.train.yml --profile production up
#
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # Training Service - Connect Four Convergence
  # ===========================================================================
  training-connect-four:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: langgraph-mcts-train:latest
    container_name: mcts-training-connect-four
    runtime: nvidia
    command: ["python", "-m", "src.training.self_play_convergence", "--domain", "connect_four", "--profile", "dev", "--checkpoint-dir", "/app/checkpoints/connect_four"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - TRAINING_USE_MIXED_PRECISION=true
      - TRAINING_CUDA_MEMORY_FRACTION=0.9
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./cache:/app/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - training-network
    restart: unless-stopped

  # ===========================================================================
  # Training Service - Chess Convergence
  # ===========================================================================
  training-chess:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: langgraph-mcts-train:latest
    container_name: mcts-training-chess
    runtime: nvidia
    command: ["python", "-m", "src.training.self_play_convergence", "--domain", "chess", "--profile", "full", "--checkpoint-dir", "/app/checkpoints/chess"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - TRAINING_USE_MIXED_PRECISION=true
      - TRAINING_CUDA_MEMORY_FRACTION=0.9
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./cache:/app/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - training-network
    profiles:
      - production
    restart: unless-stopped


networks:
  training-network:
    driver: bridge
